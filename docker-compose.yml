services:
  web:
    build: .
    command: pnpm --filter @explainmotion/web start
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://explainmotion:explainmotion@postgres:5432/explainmotion
      REDIS_URL: redis://redis:6379
      RENDER_OUTPUT_DIR: /data/renders
    volumes:
      - em-renders:/data/renders:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build: .
    command: pnpm --filter @explainmotion/worker start
    env_file: .env
    environment:
      DATABASE_URL: postgresql://explainmotion:explainmotion@postgres:5432/explainmotion
      REDIS_URL: redis://redis:6379
      RENDER_OUTPUT_DIR: /data/renders
    volumes:
      - em-renders:/data/renders
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  redis:
    image: redis:7
    command: redis-server --appendonly yes
    volumes:
      - em-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: explainmotion
      POSTGRES_PASSWORD: explainmotion
      POSTGRES_DB: explainmotion
    volumes:
      - em-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U explainmotion"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  em-postgres:
  em-redis:
  em-renders:
