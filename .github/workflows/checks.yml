name: Review checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: explainmotion
          POSTGRES_PASSWORD: explainmotion
          POSTGRES_DB: explainmotion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U explainmotion"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://explainmotion:explainmotion@localhost:5432/explainmotion_test
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_URL: http://localhost:3000
      TEST_BASE_URL: http://localhost:3000
      STORAGE_PROVIDER: local
      RENDER_OUTPUT_DIR: /tmp/explainmotion-ci-renders
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: echo "BETTER_AUTH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck && pnpm lint && pnpm test && pnpm build
      - run: pnpm db:migrate
      - name: API integration and real worker render
        run: |
          pnpm --filter @explainmotion/web start > /tmp/web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" ${WORKER_PID:-} 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/health; then break; fi
            sleep 1
          done
          pnpm test:integration
          pnpm --filter @explainmotion/worker start > /tmp/worker.log 2>&1 &
          WORKER_PID=$!
          pnpm --filter @explainmotion/web e2e:render
      - name: Service logs
        if: failure()
        run: cat /tmp/web.log /tmp/worker.log 2>/dev/null || true
